name: CI

# whop-monorepo's SDK pipeline builds this repo and writes this file (sdks/ruby/overlay there). It
# takes the place of the ci.yml the Fern Ruby generator writes, which carries a tag-triggered
# `publish` job: `bundle install` in a job holding `id-token: write`, then `gem push`. That would be
# a second publish path beside publish-main.yml, and the tag its release job cuts would fire it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUBY_VERSION: "3.3"

jobs:
  # Everything the CI runs is bin/ci, which whop-monorepo's SDK pipeline also runs over every build
  # before delivering it.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false

      - name: CI
        run: bash bin/ci
