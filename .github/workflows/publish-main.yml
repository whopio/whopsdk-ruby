name: Release

on:
  push:
    branches: [main]
    paths: ["lib/whop_sdk/version.rb"]
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check the gem without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-whop-sdk
  cancel-in-progress: false

env:
  GEM_NAME: whop_sdk
  VERSION_FILE: lib/whop_sdk/version.rb
  RUBY_VERSION: "3.3"

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      dry: ${{ steps.gate.outputs.dry }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false

      - name: Decide whether to release
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          if [ ! -f "$VERSION_FILE" ]; then
            echo "::notice::${VERSION_FILE} does not exist — this is not a tree this workflow can release."
            emit release false
            emit dry true
            emit version ""
            exit 0
          fi

          version=$(ruby -e 'print (File.read(ENV.fetch("VERSION_FILE"))[/VERSION\s*=\s*"([^"]+)"/, 1] || "")')

          if [ -z "$version" ]; then
            echo "::error::${VERSION_FILE} has no VERSION literal."
            exit 1
          fi

          echo "${VERSION_FILE} version: $version"
          emit version "$version"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$'; then
            echo "::error::'$version' is not a version this workflow will publish."
            exit 1
          fi

          if [ "$EVENT" = "pull_request" ] || [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: building and checking the gem, publishing nothing."
            emit release true
            emit dry true
            exit 0
          fi

          emit dry false

          if [ "$EVENT" = "push" ]; then
            changed=$(git diff --name-only HEAD^ HEAD)
            if [ "$changed" != "$VERSION_FILE" ]; then
              echo "::error::a release push must change ${VERSION_FILE} and nothing else. Changed:"
              printf '%s\n' "$changed"
              exit 1
            fi

            body=$(git diff -U0 HEAD^ HEAD -- "$VERSION_FILE" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
            if [ "$(printf '%s\n' "$body" | grep -cvE '^[+-]\s*VERSION = ')" -ne 0 ]; then
              echo "::error::a release push must change only the VERSION line. Diff:"
              printf '%s\n' "$body"
              exit 1
            fi
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/${GEM_NAME}/versions/${version}.json")

          case "$status" in
            200)
              echo "::notice::${GEM_NAME} ${version} is already on RubyGems; nothing to publish."
              emit release false
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::RubyGems returned HTTP $status for ${GEM_NAME} ${version}; refusing to guess whether it is published."
              exit 1
              ;;
          esac

          latest=$(curl -sS --fail "https://rubygems.org/api/v1/gems/${GEM_NAME}.json" | ruby -rjson -e 'print JSON.parse($stdin.read).fetch("version")')
          echo "Latest on RubyGems: $latest"

          ruby -e '
            candidate, latest = Gem::Version.new(ARGV[0]), Gem::Version.new(ARGV[1])
            next if candidate >= latest
            abort("::error::#{ENV.fetch("VERSION_FILE")} is at #{candidate} but RubyGems already has #{latest}. " \
                  "This branch was generated before that release; regenerate it before merging.")
          ' "$version" "$latest"

          emit release true

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false

      - name: Sync the version stamps
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          ruby - "$VERSION" <<'RB'
          version = ARGV.fetch(0)
          stamped = 0

          version_file = ENV.fetch("VERSION_FILE")
          text = File.read(version_file)
          text, count = text.sub(/(VERSION\s*=\s*")[^"]*/) { "#{Regexp.last_match(1)}#{version}" }, text.scan(/VERSION\s*=\s*"[^"]*"/).size
          abort("::error::no VERSION literal found in #{version_file}") if count.zero?
          File.write(version_file, text)
          stamped += count

          raw_client = "lib/whop_sdk/internal/http/raw_client.rb"
          if File.exist?(raw_client)
            source = File.read(raw_client)
            source, header = source.gsub(/("X-Fern-SDK-Version":\s*")[^"]*/) { "#{Regexp.last_match(1)}#{version}" },
                             source.scan(/"X-Fern-SDK-Version":\s*"[^"]*"/).size
            abort("::error::#{raw_client} exists but carries no X-Fern-SDK-Version stamp") if header.zero?
            File.write(raw_client, source)
            stamped += header
          end

          puts "stamped #{stamped} occurrence(s) with #{version}"
          RB

          stale=$(grep -rEn '"X-Fern-SDK-Version":\s*"[^"]*"' lib | grep -v "\"${VERSION}\"" || true)
          if [ -n "$stale" ]; then
            echo "::error::the source tree still reports a version other than ${VERSION}:"
            printf '%s\n' "$stale"
            exit 1
          fi

      - name: Build the gem
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p pkg
          gem build "${GEM_NAME}.gemspec" --output "pkg/${GEM_NAME}-${VERSION}.gem"
          ls -l pkg

      - name: Smoke-test the built gem
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          export GEM_HOME=/tmp/smoke
          gem install --no-document "pkg/${GEM_NAME}-${VERSION}.gem"
          ruby -e '
            gem_name, expected = ENV.fetch("GEM_NAME"), ENV.fetch("VERSION")
            require gem_name
            installed = Gem::Specification.find_by_name(gem_name).version.to_s
            abort("gem reports #{installed}, expected #{expected}") unless installed == expected
            namespace = Object.const_defined?(:Whop_sdk) ? Whop_sdk : WhopSDK
            abort("#{namespace} has no Client") unless namespace.const_defined?(:Client)
            puts "#{gem_name} #{installed} installs, loads and exposes #{namespace}::Client"
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pkg
          path: pkg/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true' && needs.decide.outputs.dry == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pkg
          path: pkg/

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false

      - name: Push the gem to RubyGems
        env:
          VERSION: ${{ needs.decide.outputs.version }}
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEM_HOST_API_KEY:-}" ]; then
            echo "::error::RUBYGEMS_API_KEY is not set on this repository; the push would fail after the build."
            exit 1
          fi
          gem push "pkg/${GEM_NAME}-${VERSION}.gem"

  tag:
    needs: [decide, build, publish]
    if: always() && needs.decide.outputs.dry == 'false' && needs.decide.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag the published version
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/${GEM_NAME}/versions/${VERSION}.json")
          if [ "$status" != "200" ]; then
            echo "::notice::${GEM_NAME} ${VERSION} is not on RubyGems (HTTP $status); nothing to tag."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already tagged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "whop_sdk ${VERSION}"

          git push origin "refs/tags/v${VERSION}" || \
            git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null
