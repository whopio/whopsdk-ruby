name: Release

# Publishes whop_sdk to RubyGems and GitHub whenever main carries a version not yet published
# there. Only whop-monorepo's SDK pipeline pushes main, and it renders this workflow
# (sdks/release/publish-main.yml.liquid there): plan asks each module whether it has the version
# (.github/release/cli.ts), build checks and packages it (bin/package.sh), and one job per
# module publishes it, in order. Re-running a run, or dispatching one on main, publishes nothing a
# module already has.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, in push order: every run waits its turn, so no version a delivery raised
# is skipped.
concurrency:
  group: publish-whopsdk-ruby
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      page: ${{ steps.plan.outputs.page }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - id: plan
        run: node .github/release/cli.ts plan --module rubygems --module github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The release, built and checked from this commit: bin/package.sh leaves what each module's
  # job publishes where the build uploads it from.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Package the release
        id: package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: bash bin/package.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rubygems
          path: pkg/
          if-no-files-found: error
          retention-days: 7

  # Trusted publishing from the main-only rubygems environment: configure-rubygems-credentials trades
  # the run's identity token for a short-lived API key. The job pushes the gem the build job built
  # and tested, and installs nothing while it holds the key.
  rubygems:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: rubygems
      url: ${{ needs.plan.outputs.page }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rubygems
          path: pkg/

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      # A version RubyGems already has is left alone, so re-running this job after a push that
      # landed publishes nothing.
      - name: Push the gem to RubyGems
        env:
          GEM_NAME: whop_sdk
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/${GEM_NAME}/versions/${VERSION}.json")
          case "$status" in
            200) echo "::notice::RubyGems already has ${GEM_NAME} ${VERSION}; nothing to push." ;;
            404) gem push "pkg/${GEM_NAME}-${VERSION}.gem" ;;
            *) echo "::error::RubyGems answered ${status} for ${GEM_NAME} ${VERSION}; refusing to guess whether it is published."; exit 1 ;;
          esac

      - name: Wait until RubyGems has the version
        run: node .github/release/cli.ts confirm --module rubygems

  # Runs even when nothing was published: a version tagged before it had a GitHub release gets one,
  # and a repo shipped dark writes nothing. A new tag goes only on the commit of the run that planned
  # to publish (PUBLISHED): re-run that run's failed jobs.
  github:
    needs: [plan, build, rubygems]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # cli.ts release creates the version's tag and GitHub release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false

      - run: node .github/release/cli.ts release --module rubygems --module github
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.plan.outputs.publish == 'true' }}
