name: Yank

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to yank from RubyGems"
        required: true
      confirm:
        description: "Type the version again to confirm this irreversible action"
        required: true

permissions:
  contents: read

jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Yank
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}
          VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
          GEM_NAME: whop_sdk
        run: |
          set -euo pipefail

          if [ "$VERSION" != "$CONFIRM" ]; then
            echo "::error::confirmation '$CONFIRM' does not match version '$VERSION'."
            exit 1
          fi

          if [ -z "${GEM_HOST_API_KEY:-}" ]; then
            echo "::error::GEM_HOST_API_KEY is not set on this repository."
            exit 1
          fi

          status=$(curl -sS -o /tmp/before -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/${GEM_NAME}/versions/${VERSION}.json")
          if [ "$status" != "200" ]; then
            echo "::error::${GEM_NAME} ${VERSION} is not published (HTTP $status); nothing to yank."
            exit 1
          fi
          echo "${GEM_NAME} ${VERSION} is published; yanking."

          gem yank "$GEM_NAME" -v "$VERSION"

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://rubygems.org/api/v2/rubygems/${GEM_NAME}/versions/${VERSION}.json")
          if [ "$status" = "404" ]; then
            echo "${GEM_NAME} ${VERSION} is yanked."
          else
            echo "::error::after yank, RubyGems still returns HTTP $status for ${VERSION}."
            exit 1
          fi

          latest=$(curl -sS "https://rubygems.org/api/v1/versions/${GEM_NAME}/latest.json" | jq -r .version)
          echo "latest is now $latest"
